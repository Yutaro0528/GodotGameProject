name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ANTHROPIC_API_KEY が未設定のリポジトリで PR を赤くしないためのガード。
      # secrets コンテキストはジョブレベルの if で参照できないため、
      # env 経由でステップレベルに落として判定する。
      - name: Check ANTHROPIC_API_KEY
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY が未設定のためスキップしました。リポジトリの Settings → Secrets and variables → Actions で設定してください（README の「Claude まわりのセットアップ」を参照）。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.secret.outputs.configured == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --max-turns 15
            --mcp-config .mcp.json
          prompt: |
            この PR をレビューしてください。CLAUDE.md の規約が唯一の基準です。

            重点的に見る観点:
            1. GDScript の静的型付け — すべての変数・引数・戻り値に型注釈があるか
            2. コード配置 — scripts/core/ に Node / シーンツリー / シグナル依存が
               漏れていないか。逆に、シーンツリー無しでテストできるロジックが
               scripts/ 側の Node に埋め込まれていないか
            3. .tscn / .tres — load_steps の整合、parent= がノード「名」で正しい
               パスを指しているか、消したノードの ext_resource が残っていないか、
               既存の uid:// が書き換えられていないか
            4. テスト — 追加・変更されたロジックに対応するテストが tests/ にあるか
            5. PR 本文 — 「ローカル作業依頼」と「動作確認手順」が書かれているか
               （アセット制作と手触り確認は人間の担当なので、依頼が漏れると止まる）

            指摘は具体的なファイルと行に紐づけ、修正案を添えてください。
            問題がなければその旨だけ簡潔に伝えてください。
