name: godot-tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.7.2"
  # Godot は終了時に RID/ObjectDB のリーク警告で非ゼロ終了することがあり、
  # テストが全部通っていても赤くなる。テスト失敗とは別物なので抑制する。
  GODOT_DISABLE_LEAK_CHECKS: "1"

jobs:
  # パースチェックとシーン検証。テストより先に走らせてフィードバックを速くする。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      # ウォームアップ import。.godot/ をコミットしていないため省略不可。
      # これを飛ばすと class_name が未登録になり、後続が軒並み落ちる。
      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Check GDScript for parse errors
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            if ! godot --headless --path . --check-only --script "res://${rel}"; then
              echo "::error file=${rel}::GDScript parse error"
              failed=1
            fi
          done < <(find ./scripts ./tests ./tools -name '*.gd' -print0)
          exit "${failed}"

      # Claude が .tscn / .tres をテキスト編集する運用における最重要のガード。
      - name: Validate scenes and resources
        run: godot --headless --path . --script res://tools/validate_scenes.gd

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          # addons/gdUnit4 にコミット済みのバージョンとそろえること。
          # ずれると Action 側が別バージョンを入れて挙動が変わる。
          version: "v6.2.1"
          paths: "res://tests"
          timeout: 10
          warnings-as-errors: true
