name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # .mcp.json の godot-docs MCP サーバ（npx）に Node が必要。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ANTHROPIC_API_KEY が未設定のリポジトリで PR を赤くしないためのガード。
      # secrets コンテキストはジョブレベルの if で参照できないため、
      # env 経由でステップレベルに落として判定する。
      - name: Check ANTHROPIC_API_KEY
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY が未設定のためスキップしました。リポジトリの Settings → Secrets and variables → Actions で設定してください（README の「Claude まわりのセットアップ」を参照）。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.secret.outputs.configured == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --max-turns 20
            --mcp-config .mcp.json
